<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Track:Dive</title>
</head>

<body>
    <header>
        <nav id="navbar">
            <h1 id="title">Track:Dive</h1>
        </nav>
    </header>
    <section id="intro">
        <h1 id="intro-text">단순한 감상을 넘어, 사운드의 깊숙한 곳으로. Track:Dive와 함께 떠나는 음악 체험.</h1>
    </section>
    <section id="silder">
        <div id="silder-container">
            <div id="slide-frame">
                <div class="slide">
                    <img src="images/1.jpg" class="slide-img" alt="1">
                </div>
                <div class="slide">
                    <img src="images/2.jpg" class="slide-img" alt="2">
                </div>
                <div class="slide">
                    <img src="images/3.jpg" class="slide-img" alt="3">
                </div>
                <div class="slide">
                    <img src="images/4.jpg" class="slide-img" alt="4">
                </div>
            </div>
            <button class="slide-btn" id="prev">&#10094;</button>
            <button class="slide-btn" id="next">&#10095;</button>
        </div>
    </section>
    <section id="media">
        <div id="media-container">
            <iframe width="916" height="515" src="https://www.youtube.com/embed/qGlxgRUneDA?list=RDMMqGlxgRUneDA" title="신나는 퇴근길! 기분 좋은 드라이브 (사랑스러운 / 저작권 걱정 없는 BGM) Her" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>
    <section id="additional">
        <div class="container">
            <div class="content-block">
                <div class="text-content">
                    <p>가을 바람이 부는 거리.</p>
                </div>
                <div class="image-content">
                    <img src="images/benches.jpg" alt="Event Img1">
                </div>
            </div>
            <div class="content-block reverse">
                <div class="text-content">
                    <p>노을이 지는 바닷가, 해질 무렵의 잔잔한 물결.</p>
                </div>
                <div class="image-content">
                    <img src="images/boat.jpg" alt="Event Img2">
                </div>
            </div>
            <div class="content-block">
                <div class="text-content">
                    <p>비오는데 기분이 좋은 그런 순간.</p>
                </div>
                <div class="image-content">
                    <img src="images/puddle.jpg" alt="Event Img1">
                </div>
            </div>
        </div>
    </section>
    <section id="rhythm">
        <div id="btn-container">
            <button id="trackDive">Track:Dive</button>
        </div>
    </section>
</body>

</html>
